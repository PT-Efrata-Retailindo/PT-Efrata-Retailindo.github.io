<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Efrata Management System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base href="/">
    <!-- imported CSS are concatenated and added automatically -->
  <link href="styles.css" rel="stylesheet"></head>
  <body aurelia-app="main">
    <div class="splash">
      <div class="splash-content">
        <div class="splash-logo">
          <div class="efrata-symbol"></div>
        </div>
        <div class="message">Efrata Management System</div>
        <div class="initial-progress-container">
          <div class="initial-progress-bar">
            <div class="initial-progress-fill"></div>
          </div>
          <div class="initial-progress-text">Initializing Application...</div>
        </div>
      </div>
    </div>
    
    <!-- Webpack Dev Server reload -->
    <script src="/webpack-dev-server.js"></script>
    
  <script type="text/javascript" src="aurelia-bootstrap.bundle.js"></script><script type="text/javascript" src="aurelia.bundle.js"></script><script type="text/javascript" src="underscore.bundle.js"></script><script type="text/javascript" src="app.bundle.js"></script></body>
</html>
